# FIN-C2-006 — Financial Data Entry Validation Rules
# Loaded by ValidateNode at startup.
#
# Structure:
#   required_fields:   list of field names that MUST be present
#   format_rules:      named format checks (regex pattern per field list)
#   range_rules:       numeric range constraints per field list
#   regex_rules:       arbitrary regex constraints (maps to WARN if partial match)
#
# All field names are matched case-insensitively after lower-casing and
# normalising spaces/hyphens to underscores.

required_fields:
  - amount
  - currency

format_rules:
  iban:
    fields:
      - iban
      - account_iban
      - beneficiary_iban
      - debtor_iban
    # IBAN: 2-letter country, 2-digit check, 4-char bank code, 7-digit basic
    # account number, optional remainder (up to 16 chars).
    pattern: "^[A-Z]{2}[0-9]{2}[A-Z0-9]{4}[0-9]{7}[A-Z0-9]{0,16}$"
    description: "IBAN (International Bank Account Number)"
    severity: "FAIL"

  swift_bic:
    fields:
      - swift_code
      - bic
      - swift_bic
      - bank_bic
    # SWIFT/BIC: 4-letter bank code, 2-letter country, 2-char location, optional 3-char branch
    pattern: "^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$"
    description: "SWIFT / BIC code"
    severity: "FAIL"

  date_iso:
    fields:
      - value_date
      - settlement_date
      - transaction_date
      - execution_date
      - booking_date
    # ISO 8601 date: YYYY-MM-DD
    pattern: "^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
    description: "Date in YYYY-MM-DD format"
    severity: "FAIL"

  currency_code:
    fields:
      - currency
      - transaction_currency
      - settlement_currency
    # ISO 4217: exactly 3 uppercase letters
    pattern: "^[A-Z]{3}$"
    description: "ISO 4217 currency code (e.g. USD, EUR, JPY)"
    severity: "FAIL"

  amount_format:
    fields:
      - amount
      - transaction_amount
      - settlement_amount
    # Numeric with up to 2 decimal places, optional leading minus
    pattern: "^-?[0-9]+(?:\\.[0-9]{1,2})?$"
    description: "Numeric amount (up to 2 decimal places)"
    severity: "FAIL"

range_rules:
  amount_range:
    fields:
      - amount
      - transaction_amount
      - settlement_amount
    min: 0.01
    max: 100000000.00
    description: "Transaction amount must be between 0.01 and 100,000,000"
    severity: "WARN"

regex_rules:
  reference_format:
    fields:
      - reference
      - transaction_reference
      - end_to_end_id
    # Payment reference: alphanumeric + hyphens/slashes, 1–35 chars
    pattern: "^[A-Za-z0-9/\\-?:().,'+\\s]{1,35}$"
    description: "Payment reference (1–35 chars, alphanumeric + limited punctuation)"
    severity: "WARN"
